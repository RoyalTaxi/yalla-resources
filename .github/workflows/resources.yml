name: Resources

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  generator:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run generator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Run resource generator check
        run: python3 tools/yalla_resources.py check --strict
